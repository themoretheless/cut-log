name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_VERSION: 1.96.0
  WASM_PACK_VERSION: 0.15.0
  WASM_OPT_VERSION: 0.116.1

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check version
        # Dependabot can't edit version.json, so its dependency PRs always trip
        # the "already released" check. Exempt it: the dep change still ships on
        # the next deploy (release.yml gracefully skips re-tagging when the
        # version is unchanged), it just doesn't cut a new release tag. Human
        # PRs that touch dependencies still have to bump, since they ship code.
        # Key off the PR author, not github.actor: updating the branch (e.g.
        # `gh pr update-branch`) makes a human the actor while the author stays
        # dependabot, and we still want the exemption then.
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          VERSION=$(node -p 'require("./version.json").version')
          LATEST=$(git tag --sort=-v:refname | grep '^v[0-9]' | head -1 | sed 's/^v//' || echo "0.0.0")

          # Check if code files changed (not just CI/docs)
          CODE_CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep -v '^\.github/' \
            | grep -v '^\.vscode/' \
            | grep -v '^\.claude/' \
            | grep -v '^\.gitignore' \
            | grep -v '^README' \
            | grep -v '^LICENSE' \
            | grep -v '^CHANGELOG' \
            | grep -v '^\.env' \
            | grep -v '\.md$' \
            || true)

          if [ -n "$CODE_CHANGED" ]; then
            if git tag -l "v${VERSION}" | grep -q .; then
              echo "::error::v${VERSION} already released. Bump version.json."
              exit 1
            fi
            if [ "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "::error::v${VERSION} is less than latest release v${LATEST}. Version must be higher."
              exit 1
            fi
            echo "New version v${VERSION} (latest: v${LATEST})"
          else
            echo "No code changes, version bump not required"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-opt
            ~/.cargo/bin/wasm-opt.version
          key: ${{ runner.os }}-tools-wasm-pack-${{ env.WASM_PACK_VERSION }}-wasm-opt-${{ env.WASM_OPT_VERSION }}

      - name: Install wasm-pack
        run: |
          wasm-pack --version 2>/dev/null | grep -qx "wasm-pack ${WASM_PACK_VERSION}" \
            || cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked --force

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build WASM
        working-directory: crates/wasm
        run: wasm-pack build --target web --release

      - name: Install wasm-opt
        run: |
          if [ ! -x "${CARGO_HOME}/bin/wasm-opt" ] \
            || [ "$(cat "${CARGO_HOME}/bin/wasm-opt.version" 2>/dev/null)" != "${WASM_OPT_VERSION}" ]; then
            cargo install wasm-opt --version "${WASM_OPT_VERSION}" --locked --force
            printf '%s\n' "${WASM_OPT_VERSION}" > "${CARGO_HOME}/bin/wasm-opt.version"
          fi
          "${CARGO_HOME}/bin/wasm-opt" --version

      - name: Optimize WASM
        run: |
          "${CARGO_HOME}/bin/wasm-opt" -Oz --enable-bulk-memory \
            crates/wasm/pkg/cutter_wasm_bg.wasm \
            -o crates/wasm/pkg/cutter_wasm_bg.wasm
          ls -lh crates/wasm/pkg/cutter_wasm_bg.wasm

      - name: Smoke test generated WASM
        run: node scripts/wasm-smoke.mjs

      - name: Copy WASM to frontend
        run: |
          mkdir -p frontend/wasm frontend/public
          cp -r crates/wasm/pkg/* frontend/wasm/
          cp crates/wasm/pkg/cutter_wasm_bg.wasm frontend/public/

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and test frontend
        working-directory: frontend
        run: |
          npx vue-tsc --noEmit
          npm test -- --typecheck.enabled

      - name: Build Vue
        working-directory: frontend
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ inputs.ref || '' }}
          VITE_APP_SHA: ${{ github.sha }}

      - name: SPA fallback for GitHub Pages
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: frontend/dist
